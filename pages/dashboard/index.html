<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SoL-Astr</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="bar">
      <span class="mark">sol-astr</span>
      <span class="tag" id="mode-tag">…</span>
      <span class="grow"></span>
      <button class="btn" id="refresh">刷新</button>
    </header>

    <main>
      <section id="sec-status">
        <p class="readout" id="readout">正在读取运行状态…</p>
        <dl class="stats" id="stats"></dl>
        <div class="alerts" id="alerts"></div>
      </section>

      <section>
        <header class="sec">
          <span class="sec-label">标尺</span>
          <span class="sec-note" id="ruler-note"></span>
        </header>
        <div class="ruler" id="ruler"></div>
        <div class="legend" id="ruler-legend"></div>
      </section>

      <section>
        <header class="sec"><span class="sec-label">会话</span></header>
        <div id="sessions"></div>
      </section>

      <section>
        <header class="sec">
          <span class="sec-label">价目</span>
          <span class="sec-note">OpenRouter 牌价，只用来比谁划算</span>
        </header>
        <div id="models"></div>
      </section>

      <section>
        <header class="sec">
          <span class="sec-label">模拟</span>
          <span class="sec-note">拖一下，看这笔账怎么判</span>
        </header>
        <div id="sim"></div>
      </section>

      <section>
        <header class="sec"><span class="sec-label">台账</span></header>
        <div id="ledger"></div>
      </section>

      <section>
        <header class="sec">
          <span class="sec-label">配置</span>
          <span class="sec-note">摘要模型和提示词在核心配置里，这里只读</span>
        </header>
        <div id="config"></div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
